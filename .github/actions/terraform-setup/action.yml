# Shared setup for jobs that talk to AWS: check the sensitive inputs, install Terraform,
# assume an IAM role through GitHub OIDC (short-lived credentials, no stored keys), and
# initialize the S3 backend. The calling job sets TF_VAR_alert_email and
# TF_VAR_jenkins_allowed_cidr from repository secrets.
name: Terraform setup
description: Validate inputs, install Terraform, assume an AWS role via OIDC, and init the S3 backend

inputs:
  role-to-assume:
    description: IAM role ARN to assume
    required: true
  role-session-name:
    description: Session name shown in CloudTrail
    required: true
  terraform-version:
    description: Terraform version to install
    required: true
  aws-region:
    description: AWS region
    required: true

runs:
  using: composite
  steps:
    # Trims surrounding whitespace (a common copy-paste artifact), then reports which
    # inputs are missing or malformed without printing their values.
    - name: Check required secrets
      shell: bash
      run: |
        bad=0
        for name in TF_VAR_alert_email TF_VAR_jenkins_allowed_cidr; do
          value="${!name}"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          if [ -n "$value" ] && [ "$value" != "${!name}" ]; then
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
            echo "${name}: trimmed surrounding whitespace"
          fi
          problems=()
          [ -z "$value" ] && problems+=("empty")
          [[ "$value" =~ [[:space:]] ]] && problems+=("contains whitespace or a newline")
          [[ "$value" == *\"* || "$value" == *\'* ]] && problems+=("contains quotes")
          [[ "$value" == *=* ]] && problems+=("contains '=' (paste only the value, not the tfvars line)")
          if [ ${#problems[@]} -gt 0 ]; then
            msg=$(IFS=';'; echo "${problems[*]}")
            echo "::error::Secret ${name^^} is invalid: ${msg//;/, }. Re-enter it under Settings > Secrets and variables > Actions > Secrets."
            bad=1
          else
            echo "${name}: set"
          fi
        done
        exit $bad

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: ${{ inputs.role-session-name }}
        aws-region: ${{ inputs.aws-region }}

    - name: Terraform init (S3 backend)
      shell: bash
      working-directory: terraform
      run: terraform init -input=false -lock-timeout=5m
