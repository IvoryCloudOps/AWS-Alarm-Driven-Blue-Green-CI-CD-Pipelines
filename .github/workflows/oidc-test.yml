name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::075723833258:role/GitHubActions-BlueGreenDelivery
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity